pluginManagement {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'poker-backend'

include 'poker-common'
include 'poker-gateway'
include 'poker-user'
include 'poker-room'
include 'poker-game'
include 'poker-match'
include 'poker-admin'
